[project]
name = "parag"
version = "0.1.0"
description = "Personal Agentic RAG: System 1 + System 2 thinking over your notes, books and documents. Private, local-first, measurable."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Mohit" }, { name = "Kunal" }]
dependencies = [
    "cryptography>=42",
    "pypdf>=4",
]

[project.optional-dependencies]
ui = ["chainlit>=2.0", "requests"]  # requests: undeclared dependency of chainlit's traceloop-sdk
tracing = ["arize-phoenix-otel", "opentelemetry-api", "opentelemetry-sdk"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
parag = "parag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
