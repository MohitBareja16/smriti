[project]
name = "smriti"
version = "0.1.0"
description = "Smriti (स्मृति): a private, local-first agentic RAG with System 1 + System 2 thinking over your notes, books and documents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Smriti contributors" }]
dependencies = [
    "cryptography>=42",
    "langgraph>=0.2",
    "pypdf>=4",
]

[project.optional-dependencies]
ui = ["chainlit>=2.0", "requests"]  # requests: undeclared dependency of chainlit's traceloop-sdk
tracing = ["arize-phoenix-otel", "opentelemetry-api", "opentelemetry-sdk"]
docx = ["python-docx>=1.1"]
research = ["matplotlib>=3.7"]
# Model-based System-1 checks (grounding, later the SetFit router). For a small CPU-only PyTorch, first run:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.5", "opentelemetry-sdk"]

[project.scripts]
smriti = "smriti.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smriti"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
