name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (commands you ran)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version, Ollama model (if any)
