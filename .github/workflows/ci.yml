name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Offline eval (extractive reasoner, no model needed)
        run: smriti eval --out evals/results
        env:
          SMRITI_LLM: extractive
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: evals/results/
